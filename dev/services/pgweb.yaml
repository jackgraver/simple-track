# Web UI for browsing the dev database (as the owner: RLS would hide rows from the app role), http://localhost:$DEV_PGWEB_PORT (8081 in the main checkout)
version: "0.5"
processes:
  pgweb:
    command: pgweb --listen=${DEV_PGWEB_PORT} --bind=127.0.0.1 --skip-open --url "${DATABASE_OWNER_URL}"
    depends_on:
      postgres:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${DEV_PGWEB_PORT}
        path: /
      period_seconds: 2
    availability:
      restart: on_failure
