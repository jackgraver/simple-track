# One-shot: seed sample data into an empty dev DB (no-op if exercises already exist).
# After devuser: owned rows belong to the dev login, so it must exist first.
version: "0.5"
processes:
  devseed:
    working_dir: backend
    command: go run ./cmd/devseed
    depends_on:
      migrate:
        condition: process_completed_successfully
      devuser:
        condition: process_completed_successfully
