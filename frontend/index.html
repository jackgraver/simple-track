<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <script>
      // Set the theme before first paint. st:theme = dark (default) | light | system.
      (function () {
        var t = 'dark';
        try { t = localStorage.getItem('st:theme') || 'dark'; } catch (e) {}
        if (t === 'system') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (t !== 'light') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'light' ? '#f7f7f7' : '#0d0d0d');
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Simple Tracker">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Self-hosted (npm: @fontsource-variable/plus-jakarta-sans, imported in main.ts).
         Preload the latin subset so it downloads with the HTML instead of after first render. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2"
    />
    <title>Simple Tracker</title>
  </head>
  <body class="font-sans antialiased">
    <div id="app" class="min-h-dvh w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
