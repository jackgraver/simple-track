server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only inherits add_header into a location that sets none of its
    # own, so the locations below that add headers repeat this.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app shell names this build's hashed assets, so browsers must
    # revalidate it on every load (cheap: ETag -> 304). Without this they
    # cache it heuristically for days after a deploy and keep requesting
    # chunks that no longer exist. The SPA fallback below lands here too.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output: a name never changes content, so cache forever.
    # A missing chunk (an old tab asking for the previous build's file) must
    # be a real 404, not index.html served as text/html.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        # No "always": only successful responses get the year-long cache.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
