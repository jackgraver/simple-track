# The image's default "main" format logs the Referer, and a /setup/<token>
# page's asset requests carry that URL in it (Caddy also sends no referrer
# from /setup/*; this covers the gap until that deploy, and any later
# change to it). Same fields as "main", minus the referer.
log_format noreferer '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 3000;
    access_log /var/log/nginx/access.log noreferer;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only inherits add_header into a location that sets none of its
    # own, so the locations below that add headers repeat this.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app shell names this build's hashed assets, so browsers must
    # revalidate it on every load (cheap: ETag -> 304). Without this they
    # cache it heuristically for days after a deploy and keep requesting
    # chunks that no longer exist. The SPA fallback below lands here too.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
    }

    # Written by the j-cicd stamp-version step: which commit this build came
    # from. j-cicd's post-deploy check reads it, so it must never be cached.
    location = /version.json {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build output: a name never changes content, so cache forever.
    # A missing chunk (an old tab asking for the previous build's file) must
    # be a real 404, not index.html served as text/html.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        # No "always": only successful responses get the year-long cache.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # One-time setup/reset links (/setup/<token>, multi-user C6): the token is
    # a credential until it's used, so it stays out of the access log. Serves
    # the app shell without an internal redirect (try_files would finish in
    # `location = /index.html` and log the original request line there).
    location /setup/ {
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # No gzip here: Caddy in front compresses (zstd/gzip) for the whole site.
    # nginx's gzip never ran anyway, since gzip_proxied defaults to off and
    # Caddy's requests carry a Via header.
}
