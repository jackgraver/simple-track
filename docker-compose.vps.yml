services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-simpletracker}
            POSTGRES_USER: ${POSTGRES_USER:-simpletracker}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${POSTGRES_USER:-simpletracker} -d ${POSTGRES_DB:-simpletracker}
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        image: ${BACKEND_IMAGE:-ghcr.io/jackgraver/st-backend:latest}
        pull_policy: always
        ports:
            - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
        environment:
            LISTEN_ADDR: 0.0.0.0:8080
            APP_ENV: production
            TZ: ${TZ:-America/Edmonton}
            # The server connects as simpletrack_app (DML only; RLS applies). `/app/migrate up`
            # (j-cicd pre_swap, run in this service) connects as the owner and sets
            # simpletrack_app's password from DATABASE_URL_PRODUCTION. docs/ARCHITECTURE.md.
            DATABASE_URL_PRODUCTION: postgresql://simpletrack_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-simpletracker}?sslmode=disable
            DATABASE_OWNER_URL: postgresql://${POSTGRES_USER:-simpletracker}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-simpletracker}?sslmode=disable
            DATABASE_ALLOW_INSECURE: "true"
            # Pool overrides (defaults in backend/internal/database/pool.go); empty = default.
            DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
            DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
            DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
            DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-}
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
            CORS_ORIGINS: ${APP_ORIGIN:?APP_ORIGIN is required}
            AUTH_COOKIE_SAMESITE: lax
            AUTH_COOKIE_SECURE: "true"
            # Session lifetime (default 365 days). Lowering it also ends longer-lived sessions already issued.
            AUTH_COOKIE_MAX_AGE_SEC: ${AUTH_COOKIE_MAX_AGE_SEC:-31536000}
            ALLOW_BYPASS: "false"
            REGISTER_ENABLED: "false"
            LOGIN_RATE_LIMIT_WINDOW_SEC: ${LOGIN_RATE_LIMIT_WINDOW_SEC:-900}
            LOGIN_RATE_LIMIT_MAX_IP: ${LOGIN_RATE_LIMIT_MAX_IP:-30}
            LOGIN_RATE_LIMIT_MAX_USERNAME: ${LOGIN_RATE_LIMIT_MAX_USERNAME:-5}
            LOGIN_SPRAY_WINDOW_SEC: ${LOGIN_SPRAY_WINDOW_SEC:-600}
            LOGIN_SPRAY_MAX_USERNAMES: ${LOGIN_SPRAY_MAX_USERNAMES:-5}
            LOGIN_SPRAY_BLOCK_SEC: ${LOGIN_SPRAY_BLOCK_SEC:-86400}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
            # Media lookup for movies/TV (themoviedb.org); other media types work without it.
            TMDB_API_KEY: ${TMDB_API_KEY:-}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-network
        restart: unless-stopped
        # SIGTERM starts a graceful shutdown that drains requests for up to 25 s
        # (cmd/server/serve.go); Docker's default 10 s would SIGKILL it first.
        stop_grace_period: 30s
        healthcheck:
            test:
                - CMD-SHELL
                - wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    frontend:
        image: ${FRONTEND_IMAGE:-ghcr.io/jackgraver/st-frontend:latest}
        pull_policy: always
        ports:
            - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
        networks:
            - app-network
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

networks:
    app-network:
        driver: bridge
        # Pinned so TRUSTED_PROXIES (.env.vps) can't drift: Caddy reaches the backend through the
        # gateway, and the backend trusts X-Forwarded-For only from it (docs/ARCHITECTURE.md).
        ipam:
            config:
                - subnet: 172.18.0.0/16
                  gateway: 172.18.0.1

volumes:
    postgres_data:
