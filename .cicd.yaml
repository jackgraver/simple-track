name: simple-track
# Release branch: every run builds a clean checkout of main's latest commit,
# whatever is checked out or uncommitted in the working directory.
branch: main
timeout: 20m
steps:
  - name: backend-vet
    run: go vet ./...
    dir: backend
  - name: backend-test
    run: go test ./...
    dir: backend
  - name: frontend-install
    run: mise exec node@22 -- npm ci --no-audit --no-fund
    dir: frontend
  - name: frontend-test
    run: mise exec node@22 -- npx vitest run
    dir: frontend
images:
  - name: backend
    repository: ghcr.io/jackgraver/st-backend
    dockerfile: backend/Dockerfile
    context: backend
  - name: frontend
    repository: ghcr.io/jackgraver/st-frontend
    dockerfile: frontend/Dockerfile
    context: frontend
deploy:
  host: st-vps   # ~/.ssh/config alias: jack@167.172.207.46 with the deploy key
  # The agent lives in jack's home on the VPS (no sudo needed).
  command: J_CICD_AGENT_CONFIG=/home/jack/.config/j-cicd-agent.yaml /home/jack/.local/bin/j-cicd-agent
  timeout: 10m
