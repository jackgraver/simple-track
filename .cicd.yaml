name: simple-track
# Release branch: every run builds a clean checkout of main's latest commit,
# whatever is checked out or uncommitted in the working directory.
branch: main
timeout: 20m
steps:
  # Bakes the commit into the frontend image (served at /version.json) so a
  # deploy can be verified against the live site. Runs before docker build,
  # in the same snapshot checkout.
  - name: stamp-version
    run: echo "{\"commit\":\"$(git rev-parse --short=12 HEAD)\"}" > frontend/public/version.json
  - name: backend-vet
    run: go vet ./... && go vet -tags e2e ./...
    dir: backend
  - name: backend-test
    run: go test ./... && go test -tags e2e ./internal/e2e/...
    dir: backend
  - name: frontend-install
    run: mise exec node@22 -- npm ci --no-audit --no-fund
    dir: frontend
  - name: frontend-lint
    run: mise exec node@22 -- npx eslint .
    dir: frontend
  - name: frontend-test
    run: mise exec node@22 -- npx vitest run
    dir: frontend
  # Playwright suite against the real stack (e2e/README.md). Blocking: a red or flaky suite stops
  # the deploy. ci.sh also records every run (npm run ci:history). Needs Docker.
  - name: e2e
    run: E2E_BLOCKING=1 mise exec node@22 -- ./ci.sh
    dir: e2e
images:
  - name: backend
    repository: ghcr.io/jackgraver/st-backend
    dockerfile: backend/Dockerfile
    context: backend
  - name: frontend
    repository: ghcr.io/jackgraver/st-frontend
    dockerfile: frontend/Dockerfile
    context: frontend
deploy:
  host: st-vps   # ~/.ssh/config alias: jack@167.172.207.46 with the deploy key
  # The agent lives in jack's home on the VPS (no sudo needed).
  command: J_CICD_AGENT_CONFIG=/home/jack/.config/j-cicd-agent.yaml /home/jack/.local/bin/j-cicd-agent
  timeout: 10m
  # Confirms the live site serves this build (frontend/nginx.conf sends
  # no-store for this path; no CDN in front, Caddy proxies it unauthenticated).
  verify:
    - url: https://st.jackgraver.ca/version.json
      expect_body_contains: "{{revision}}"
      timeout: 2m
